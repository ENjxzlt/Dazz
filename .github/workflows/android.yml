name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version, z. B. v1.1 (leer = kein Release)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DazzClone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dazz-clone-apk
          path: DazzClone.apk

      # A version tag push, or a manual run with a version, publishes a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Dazz Clone ${{ inputs.version || github.ref_name }}
          make_latest: true
          files: DazzClone.apk
          body: |
            **Installieren:** `DazzClone.apk` unten bei *Assets* direkt auf dem Handy antippen,
            Installation aus unbekannten Quellen erlauben, fertig. Benötigt Android 10+.
