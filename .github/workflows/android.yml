name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DazzClone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dazz-clone-apk
          path: DazzClone.apk

      # Pushing a tag like v1.0 publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DazzClone.apk
          body: |
            **Installieren:** `DazzClone.apk` unten bei *Assets* direkt auf dem Handy antippen,
            Installation aus unbekannten Quellen erlauben, fertig. Benötigt Android 10+.
